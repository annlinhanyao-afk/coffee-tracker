<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F1">
<title>生活碎片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #FFF7F1;
  --card: #FFFFFF;
  --accent: #FF8FA8;
  --accent-dark: #FF6F92;
  --accent-soft: #FFE3EA;
  --mint: #BDEFDD;
  --lavender: #E4DBFB;
  --text: #4A3F3D;
  --text-soft: rgba(74, 63, 61, 0.55);
  --shadow-warm: rgba(255, 143, 168, 0.28);
}

body {
  background: var(--bg);
  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  min-height: 100vh;
  overflow: hidden;
  color: var(--text);
}

/* 漂浮贴纸层 */
#sticker-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

.sticker {
  position: absolute;
  pointer-events: auto;
  cursor: grab;
  animation: floatIn 0.5s cubic-bezier(0.34,1.4,0.64,1) forwards;
  filter: drop-shadow(0 10px 20px var(--shadow-warm)) drop-shadow(0 2px 6px rgba(0,0,0,0.06));
  user-select: none;
}
.sticker:active { cursor: grabbing; }

@keyframes floatIn {
  from { opacity: 0; transform: scale(0.4) rotate(-8deg); }
  to { opacity: 1; transform: scale(1) rotate(var(--rot)); }
}

/* 编辑器 */
#editor {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  z-index: 20;
  background: var(--bg);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  flex-shrink: 0;
}

.top-bar .title {
  font-size: 16px;
  color: var(--text);
  font-weight: 700;
  letter-spacing: 0.5px;
}

.icon-btn {
  background: var(--card);
  border: none;
  color: var(--text);
  width: 38px; height: 38px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.15s;
  box-shadow: 0 4px 12px rgba(255, 143, 168, 0.18);
}
.icon-btn:hover { background: var(--accent-soft); transform: scale(1.05); }

.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  position: relative;
  overflow: hidden;
}

.canvas-card {
  background: var(--card);
  padding: 8px;
  border-radius: 22px;
  box-shadow: 0 12px 32px rgba(255, 143, 168, 0.22);
  display: flex;
  max-width: 100%;
  max-height: 100%;
}

.canvas-wrap {
  position: relative;
  display: block;
  line-height: 0;
  max-width: 100%;
  max-height: 100%;
}

#main-canvas {
  max-width: 100%;
  max-height: 100%;
  border-radius: 16px;
  cursor: crosshair;
  display: block;
  touch-action: none;
}

#lasso-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  border-radius: 16px;
}

.bottom-bar {
  padding: 16px 20px 32px;
  flex-shrink: 0;
}

.hint-text {
  text-align: center;
  color: var(--text-soft);
  font-size: 13px;
  margin-bottom: 14px;
}

.color-picker {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 16px;
}

.color-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid rgba(74, 63, 61, 0.12);
  padding: 0;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  transition: transform 0.15s, border-color 0.15s;
}
.color-dot:hover { transform: scale(1.12); }
.color-dot.active {
  border-color: var(--accent-dark);
  transform: scale(1.18);
  box-shadow: 0 2px 8px rgba(255, 111, 146, 0.4);
}

.actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.action-btn {
  padding: 11px 24px;
  border-radius: 24px;
  border: none;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
}
.action-btn:active { transform: scale(0.95); }
.action-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  box-shadow: 0 8px 20px rgba(255, 111, 146, 0.35);
}
.action-btn.primary:hover { box-shadow: 0 10px 24px rgba(255, 111, 146, 0.45); }
.action-btn.secondary {
  background: var(--card);
  color: var(--accent-dark);
  border: 1.5px solid var(--accent-soft);
}
.action-btn.secondary:hover { background: var(--accent-soft); }

/* 上传状态 */
#upload-state {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  background: radial-gradient(ellipse at 30% 30%, #FFE8EE 0%, var(--bg) 65%);
}

.upload-circle {
  width: 92px; height: 92px;
  border-radius: 50%;
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
  border: 1.5px dashed var(--accent);
  box-shadow: 0 10px 28px rgba(255, 143, 168, 0.25);
}
.upload-circle:hover { background: var(--accent-soft); transform: scale(1.05); box-shadow: 0 14px 32px rgba(255, 143, 168, 0.32); }

.upload-title {
  font-size: 19px;
  color: var(--text);
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.upload-sub {
  font-size: 13px;
  color: var(--text-soft);
  text-align: center;
  line-height: 1.7;
}

/* 贴纸板 */
#board-state {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
}

.board-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 25% 20%, #FFE8EE 0%, #FFF7F1 45%, #F1ECFC 100%);
}

.board-add-btn {
  position: fixed;
  bottom: 36px;
  right: 24px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  border: none;
  font-size: 24px;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 10px 26px rgba(255, 111, 146, 0.4);
  display: none;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
.board-add-btn:hover { transform: scale(1.08); box-shadow: 0 12px 30px rgba(255, 111, 146, 0.5); }

input[type="file"] { display: none; }
</style>
</head>
<body>

<!-- 上传界面 -->
<div id="upload-state">
  <div class="upload-circle" onclick="activateGyro(); document.getElementById('imgInput').click()">📷</div>
  <div class="upload-title">生活碎片</div>
  <div class="upload-sub">上传图片，手绘圈选<br>捕捉每一个瞬间</div>
  <input type="file" id="imgInput" accept="image/*">
</div>

<!-- 编辑器 -->
<div id="editor" style="display:none">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn">✕</button>
    <div class="title">圈选碎片</div>
    <button class="icon-btn" id="clearPathBtn">↺</button>
  </div>
  <div class="canvas-area">
    <div class="canvas-card">
      <div class="canvas-wrap">
        <canvas id="main-canvas"></canvas>
        <canvas id="lasso-canvas"></canvas>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="hint-text">用手指圈出想要的部分</div>
    <div class="color-picker" id="colorPicker">
      <button class="color-dot active" data-color="#ffffff" style="background:#ffffff" aria-label="白色边框"></button>
      <button class="color-dot" data-color="#FF8FA8" style="background:#FF8FA8" aria-label="粉色边框"></button>
      <button class="color-dot" data-color="#BDEFDD" style="background:#BDEFDD" aria-label="薄荷绿边框"></button>
      <button class="color-dot" data-color="#FFE08A" style="background:#FFE08A" aria-label="黄色边框"></button>
      <button class="color-dot" data-color="#E4DBFB" style="background:#E4DBFB" aria-label="薰衣草边框"></button>
      <button class="color-dot" data-color="#4A3F3D" style="background:#4A3F3D" aria-label="深色边框"></button>
    </div>
    <div class="actions">
      <button class="action-btn secondary" id="cancelBtn">取消</button>
      <button class="action-btn primary" id="captureBtn">✨ 捕捉碎片</button>
    </div>
  </div>
</div>

<!-- 贴纸漂浮板 -->
<div id="board-state">
  <div class="board-bg"></div>
</div>
<div id="sticker-layer"></div>
<button class="board-add-btn" id="addMoreBtn">+</button>

<script>
const imgInput = document.getElementById('imgInput');
const uploadState = document.getElementById('upload-state');
const editorEl = document.getElementById('editor');
const boardState = document.getElementById('board-state');
const addMoreBtn = document.getElementById('addMoreBtn');
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const lassoCanvas = document.getElementById('lasso-canvas');
const lctx = lassoCanvas.getContext('2d');
const stickerLayer = document.getElementById('sticker-layer');

let img = null;
let lasso = [];
let drawing = false;
let stickerCount = 0;
let borderColor = '#ffffff';

document.querySelectorAll('.color-dot').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-dot').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    borderColor = btn.dataset.color;
  });
});

// Upload
imgInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const image = new Image();
    image.onload = () => {
      img = image;
      setupCanvas();
      uploadState.style.display = 'none';
      editorEl.style.display = 'flex';
      boardState.style.display = 'block';
      addMoreBtn.style.display = 'flex';
      imgInput.value = '';
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function setupCanvas() {
  const cardPad = 16; // account for the white canvas-card padding around the canvas
  const maxW = Math.min(window.innerWidth - 24 - cardPad, 500);
  const maxH = window.innerHeight - 180 - cardPad;
  const scale = Math.min(maxW / img.width, maxH / img.height, 1);
  canvas.width = img.width * scale;
  canvas.height = img.height * scale;
  lassoCanvas.width = canvas.width;
  lassoCanvas.height = canvas.height;
  redrawCanvas();
}

// Draws the base photo only. Not called from the drawing loop, so it never
// has to fight with the lasso animation for the main thread.
function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

// Chaikin corner-cutting: repeatedly replaces each edge with two points 3/4
// and 1/4 along it, which rounds off every corner of the hand-drawn path
// automatically without the user needing to trace carefully.
function chaikinSmooth(points, iterations, closed) {
  let pts = points;
  for (let it = 0; it < iterations; it++) {
    const n = pts.length;
    if (n < 3) break;
    const out = [];
    if (!closed) out.push(pts[0]);
    const segments = closed ? n : n - 1;
    for (let i = 0; i < segments; i++) {
      const p0 = pts[i];
      const p1 = pts[(i + 1) % n];
      out.push({ x: p0.x * 0.75 + p1.x * 0.25, y: p0.y * 0.75 + p1.y * 0.25 });
      out.push({ x: p0.x * 0.25 + p1.x * 0.75, y: p0.y * 0.25 + p1.y * 0.75 });
    }
    if (!closed) out.push(pts[n - 1]);
    pts = out;
  }
  return pts;
}

// Builds a smoothed, rounded path through the lasso points so both the live
// preview and the final die-cut border look like a clean sticker outline
// rather than the user's exact jagged finger trace.
function tracePath(context, points, mapPoint, closed) {
  if (points.length < 2) return;
  const smoothed = chaikinSmooth(points, 2, closed).map(mapPoint);
  context.moveTo(smoothed[0].x, smoothed[0].y);
  for (let i = 1; i < smoothed.length; i++) context.lineTo(smoothed[i].x, smoothed[i].y);
  if (closed) context.closePath();
}

const identity = p => p;

// Cheap: only clears/redraws the small transparent overlay, never the photo.
function drawLassoPreview() {
  lctx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
  if (lasso.length < 2) return;
  lctx.save();
  lctx.lineJoin = 'round';
  lctx.lineCap = 'round';

  // White base stroke so the line stays visible on dark photos
  lctx.beginPath();
  tracePath(lctx, lasso, identity, !drawing);
  lctx.strokeStyle = 'rgba(255,255,255,0.9)';
  lctx.lineWidth = 5;
  lctx.stroke();

  // Coral dashed stroke on top for the marching-ants effect
  lctx.beginPath();
  tracePath(lctx, lasso, identity, !drawing);
  lctx.setLineDash([8, 5]);
  lctx.lineDashOffset = -(Date.now() / 30);
  lctx.strokeStyle = '#FF6F92';
  lctx.lineWidth = 2.5;
  lctx.stroke();

  lctx.restore();
}

function clearLassoPreview() {
  lctx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
}

// Drives the marching-ants dash animation. Runs at most while a path
// exists; it only touches the small overlay canvas, so leaving it running
// after the finger lifts (until capture/clear) costs almost nothing.
let lassoAnim = null;
function startLassoAnim() {
  if (lassoAnim) return;
  const loop = () => {
    drawLassoPreview();
    if (lasso.length > 1) {
      lassoAnim = requestAnimationFrame(loop);
    } else {
      lassoAnim = null;
    }
  };
  lassoAnim = requestAnimationFrame(loop);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

// Skip points that are too close together (sub-pixel jitter from
// high-frequency touch events) so the path array and per-frame smoothing
// stay cheap during a long drag.
function pushPoint(p) {
  const last = lasso[lasso.length - 1];
  if (last) {
    const dx = p.x - last.x, dy = p.y - last.y;
    if (dx * dx + dy * dy < 9) return;
  }
  lasso.push(p);
  drawLassoPreview();
}

canvas.addEventListener('mousedown', e => { drawing = true; lasso = [getPos(e)]; startLassoAnim(); });
canvas.addEventListener('mousemove', e => { if (!drawing) return; pushPoint(getPos(e)); });
canvas.addEventListener('mouseup', () => { drawing = false; drawLassoPreview(); });

canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; lasso = [getPos(e.touches[0])]; startLassoAnim(); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drawing) return; pushPoint(getPos(e.touches[0])); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); drawing = false; drawLassoPreview(); }, {passive:false});

// Clear lasso
document.getElementById('clearPathBtn').addEventListener('click', () => {
  lasso = []; clearLassoPreview();
});

// Back to board
document.getElementById('backBtn').addEventListener('click', () => {
  lasso = [];
  clearLassoPreview();
  editorEl.style.display = 'none';
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  lasso = [];
  clearLassoPreview();
  editorEl.style.display = 'none';
});

// Capture sticker
document.getElementById('captureBtn').addEventListener('click', () => {
  if (lasso.length < 3) return;

  // Bounding box
  const xs = lasso.map(p => p.x), ys = lasso.map(p => p.y);
  const minX = Math.max(0, Math.floor(Math.min(...xs)) - 10);
  const minY = Math.max(0, Math.floor(Math.min(...ys)) - 10);
  const maxX = Math.min(canvas.width, Math.ceil(Math.max(...xs)) + 10);
  const maxY = Math.min(canvas.height, Math.ceil(Math.max(...ys)) + 10);
  const w = maxX - minX, h = maxY - minY;
  if (w < 5 || h < 5) return;

  // Offscreen canvas with clipping
  const off = document.createElement('canvas');
  const pad = 20;
  off.width = w + pad * 2;
  off.height = h + pad * 2;
  const octx = off.getContext('2d');
  const mapPoint = p => ({ x: p.x - minX + pad, y: p.y - minY + pad });

  // Clip to lasso shape and draw the captured image
  octx.save();
  octx.beginPath();
  tracePath(octx, lasso, mapPoint, true);
  octx.clip();
  octx.drawImage(canvas, -minX + pad, -minY + pad);
  octx.restore();

  // Solid die-cut outline in the user's chosen color, drawn unclipped so
  // it's fully visible around the cutout like a printed sticker border.
  octx.save();
  octx.strokeStyle = borderColor;
  octx.lineWidth = 10;
  octx.lineJoin = 'round';
  octx.lineCap = 'round';
  octx.beginPath();
  tracePath(octx, lasso, mapPoint, true);
  octx.stroke();
  octx.restore();

  createSticker(off.toDataURL(), off.width, off.height);
  lasso = [];
  clearLassoPreview();
  editorEl.style.display = 'none';
});

// --- Gyroscope-driven gravity -------------------------------------------
// gravityX/gravityY point in the direction "down" currently is, based on
// how the phone is tilted. Defaults to straight down for desktop or when
// no sensor/permission is available, matching the old fixed-gravity feel.
let gravityX = 0;
let gravityY = 1;
let gyroActive = false;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function onDeviceOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  const gamma = clamp(e.gamma, -45, 45);      // left/right tilt
  const relBeta = clamp(e.beta - 90, -45, 45); // front/back tilt from upright
  gravityX = gamma / 45;
  gravityY = relBeta / 45;
}

function activateGyro() {
  if (gyroActive) return;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS: must be called from a user gesture handler to show the prompt.
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        gyroActive = true;
        window.addEventListener('deviceorientation', onDeviceOrientation);
      }
    }).catch(() => {});
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    gyroActive = true;
    window.addEventListener('deviceorientation', onDeviceOrientation);
  }
}
activateGyro();

// --- Ambient sticker physics ---------------------------------------------
// A single shared loop drives every resting sticker with the current
// gravity vector, so tilting the phone makes the whole board of stickers
// slide/settle together like marbles in a tray.
const GRAVITY = 0.15, DAMPING = 0.97, BOUNCE = -0.4;
const stickers = [];
let physicsRaf = null;

function ensurePhysicsLoop() {
  if (physicsRaf) return;
  const tick = () => {
    for (const s of stickers) {
      if (s.dragging || s.frozen) continue;

      s.vx += gravityX * GRAVITY;
      s.vy += gravityY * GRAVITY;
      s.vx *= DAMPING;
      s.vy *= DAMPING;
      s.x += s.vx;
      s.y += s.vy;

      const floor = window.innerHeight - s.h - 10;
      const ceil = 10, wallL = 10, wallR = window.innerWidth - s.w - 10;

      if (s.y > floor) { s.y = floor; s.vy *= BOUNCE; s.vx *= 0.85; if (Math.abs(s.vy) < 0.05) s.vy = 0; }
      if (s.y < ceil) { s.y = ceil; s.vy *= BOUNCE; if (Math.abs(s.vy) < 0.05) s.vy = 0; }
      if (s.x < wallL) { s.x = wallL; s.vx *= BOUNCE; if (Math.abs(s.vx) < 0.05) s.vx = 0; }
      if (s.x > wallR) { s.x = wallR; s.vx *= BOUNCE; if (Math.abs(s.vx) < 0.05) s.vx = 0; }

      s.el.style.left = s.x + 'px';
      s.el.style.top = s.y + 'px';
    }
    physicsRaf = requestAnimationFrame(tick);
  };
  physicsRaf = requestAnimationFrame(tick);
}

function createSticker(dataUrl, w, h) {
  stickerCount++;
  const maxSide = Math.min(window.innerWidth * 0.45, 180);
  const scale = Math.min(maxSide / w, maxSide / h, 1);
  const sw = w * scale, sh = h * scale;

  const el = document.createElement('div');
  el.className = 'sticker';

  const rot = (Math.random() - 0.5) * 24;
  el.style.setProperty('--rot', rot + 'deg');

  const x = Math.random() * Math.max(0, window.innerWidth - sw - 40) + 20;
  const y = Math.random() * Math.max(0, window.innerHeight - sh - 120) + 40;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = sw + 'px';
  el.style.height = sh + 'px';
  el.style.transform = `rotate(${rot}deg)`;

  const img2 = document.createElement('img');
  img2.src = dataUrl;
  img2.style.cssText = `width:100%;height:100%;display:block;pointer-events:none;`;
  el.appendChild(img2);

  const state = { el, x, y, vx: 0, vy: 0, w: sw, h: sh, dragging: false, frozen: true };
  stickers.push(state);

  let lastX, lastY;

  function onStart(cx, cy) {
    state.dragging = true;
    state.frozen = false;
    lastX = cx; lastY = cy;
    state.vx = 0; state.vy = 0;
    el.style.zIndex = 999;
  }

  function onMove(cx, cy) {
    if (!state.dragging) return;
    const dx = cx - lastX, dy = cy - lastY;
    lastX = cx; lastY = cy;
    state.x += dx; state.y += dy;
    state.vx = dx; state.vy = dy;
    el.style.left = state.x + 'px';
    el.style.top = state.y + 'px';
  }

  function onEnd() {
    if (!state.dragging) return;
    state.dragging = false;
    state.vx *= 0.6; state.vy *= 0.6;
  }

  el.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => onEnd());

  el.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  el.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  el.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, {passive:false});

  // Let the pop-in animation play before gravity takes over
  setTimeout(() => { state.frozen = false; }, 600);

  stickerLayer.appendChild(el);
  ensurePhysicsLoop();
}

// Add more
addMoreBtn.addEventListener('click', () => {
  activateGyro();
  imgInput.click();
});

// Keep canvas sized correctly on rotation / resize
window.addEventListener('resize', () => {
  if (!img) return;
  lasso = [];
  setupCanvas();
});
</script>
</body>
</html>
